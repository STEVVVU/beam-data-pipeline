name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m build
      - run: python -m pipeline --source customers --input fixtures/customers.jsonl --output ci-run/customers
      - run: python -m pipeline --source products --input fixtures/products.jsonl --output ci-run/products
      - run: python -m pipeline --source orders --input fixtures/orders.jsonl --output ci-run/orders
      - run: python -m reports ci-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-cli-evidence
          path: ci-run/
